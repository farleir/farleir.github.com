name: Deploy React SPA to GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.0' # Versão específica estável

      - name: Debug Directory
        run: |
          echo "Listing root:"
          ls -F
          echo "Listing react-hub:"
          ls -F react-hub/

      - name: Install Dependencies
        working-directory: ./react-hub
        run: npm install --legacy-peer-deps --verbose

      - name: Build Project
        working-directory: ./react-hub
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./react-hub/dist
          publish_branch: gh-pages
          force_orphan: false
