name: Deploy React SPA to GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: write

env:
  # Corrige as limitações e avisos de depreciação conforme sugerido pelo erro do GitHub
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Versão LTS estável recomendada para Vite 6

      - name: Install and Build
        working-directory: ./react-hub
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./react-hub/dist
          publish_branch: gh-pages
          force_orphan: false
