name: Deploy React SPA to GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # Silencia o aviso de depreciação conforme sugerido pelo log

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Node 22 LTS para máxima estabilidade com Vite 6

      - name: Install and Build
        working-directory: ./react-hub
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./react-hub/dist
          publish_branch: gh-pages
          force_orphan: false
